name: npm-audit
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit all package dirs (production deps, fail on critical+)
        run: bash scripts/security-audit.sh
      - name: Full audit incl. dev deps (informational only)
        run: AUDIT_ALL=1 AUDIT_LEVEL=low bash scripts/security-audit.sh
        continue-on-error: true
